<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>زمینم دات کام | طرح ۲ - تیره</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111318;--sur:#1a1d24;--sur2:#232731;--line:#2a2e39;--ink:#eef0f5;--mut:#9399a8;--yel:#ffc107;--navy:#0f1f4b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  button{font-family:inherit;cursor:pointer;color:inherit}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .wrap{width:min(1100px,100%);margin-inline:auto;padding-inline:16px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(17,19,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:12px;padding-block:12px}
  .logo{font-weight:900;font-size:22px;white-space:nowrap}
  .logo span{color:var(--yel)}
  .locs{display:flex;gap:8px;flex:1}
  .locbtn{display:flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;color:var(--mut);transition:.2s}
  .locbtn b{color:var(--ink);font-size:14px}
  .locbtn:hover,.locbtn.open{border-color:var(--yel)}
  .locbtn svg{width:16px;height:16px}
  .locbtn .pin{color:var(--yel)}
  .post{background:var(--yel);color:#111;border:0;border-radius:12px;padding:10px 16px;font-weight:900;font-size:14px;white-space:nowrap}
  .post:hover{filter:brightness(1.05)}

  /* search */
  .sbar{display:flex;gap:8px;margin-top:18px}
  .sbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  .sbox:focus-within{border-color:var(--yel)}
  .sbox svg{color:var(--mut)}
  .sbox input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:15px;padding:13px 0;outline:none}
  .sbox input::placeholder{color:var(--mut)}
  .sgo{background:var(--yel);color:#111;border:0;border-radius:14px;padding:0 22px;font-weight:900}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;color:var(--mut)}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#111;font-weight:700}

  /* selected neighborhood banner */
  .hb{display:none;margin-top:14px;border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;align-items:center;gap:14px}
  .hb.on{display:flex}
  .hb .em{font-size:38px;width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
  .hb h2{font-size:20px;font-weight:900;line-height:1.4}
  .hb p{font-size:13.5px;opacity:.85}
  .hb .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .hb .tags span{background:rgba(0,0,0,.25);border-radius:8px;padding:1px 9px;font-size:12px}
  .hb .clr{margin-inline-start:auto;align-self:flex-start;background:rgba(0,0,0,.3);border:0;border-radius:10px;padding:5px 10px;font-size:13px;color:#fff;white-space:nowrap}

  /* list */
  .head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
  .head h2{font-size:18px;font-weight:900}
  .head span{color:var(--mut);font-size:13px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:60px}
  @media (max-width:820px){.list{grid-template-columns:1fr}}
  .ad{display:flex;gap:14px;background:var(--sur);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;transition:.2s}
  .ad:hover{border-color:#3b4150;transform:translateY(-2px)}
  .th{position:relative;width:132px;aspect-ratio:1;flex:none;border-radius:14px;overflow:hidden}
  .th svg.pic{width:100%;height:100%;display:block}
  .cnt{position:absolute;bottom:7px;right:7px;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px}
  .cnt svg{width:14px;height:14px}
  .vip{position:absolute;top:7px;right:7px;background:var(--yel);color:#111;font-size:11.5px;font-weight:900;border-radius:7px;padding:1px 8px}
  .ad .txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .ad .ty{font-size:12px;color:var(--yel);font-weight:700}
  .ad h3{font-size:15.5px;font-weight:700;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ad .m{font-size:13px;color:var(--mut);margin-top:2px}
  .ad .pr{margin-top:auto;font-weight:900;font-size:15px}
  .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}

  /* neighborhood picker */
  .pk{position:fixed;inset:0;z-index:40;display:none}
  .pk.on{display:block}
  .pk .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .panel{position:absolute;top:70px;right:50%;transform:translateX(50%);width:min(760px,calc(100% - 24px));max-height:calc(100vh - 90px);overflow:auto;background:var(--sur);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateX(50%) translateY(-8px)}to{opacity:1;transform:translateX(50%)}}
  .ph{display:flex;justify-content:space-between;align-items:center}
  .ph b{font-size:18px}
  .x{border:0;background:var(--sur2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
  .rtabs{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:4px;margin-top:14px}
  .rtabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-size:14px;color:var(--mut)}
  .rtabs button.on{background:var(--sur2);color:var(--ink);font-weight:700}
  .hsearch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:10px}
  .hsearch input{flex:1;border:0;background:none;color:var(--ink);font-family:inherit;font-size:14px;padding:10px 0;outline:none}
  .hsearch svg{color:var(--mut)}
  .hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  @media (max-width:640px){.hgrid{grid-template-columns:1fr 1fr}}
  .hc{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--bg);transition:.2s;text-align:right}
  .hc:hover{transform:translateY(-2px)}
  .hc.on{border-color:var(--yel)}
  .hc .top{height:74px;display:flex;align-items:flex-end;justify-content:space-between;padding:8px 10px}
  .hc .top .e{font-size:30px;line-height:1}
  .hc .top .rg{font-size:11px;background:rgba(0,0,0,.3);border-radius:6px;padding:0 7px;color:#fff}
  .hc .bd{padding:8px 10px 10px}
  .hc b{display:block;font-size:15px}
  .hc small{display:block;color:var(--mut);font-size:12px;line-height:1.6}
  .hc .n{display:inline-block;margin-top:5px;font-size:12px;background:var(--sur2);border-radius:7px;padding:0 8px}
  .hc .ck{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--yel);color:#111;display:none;place-items:center;font-weight:900;font-size:14px}
  .hc.on .ck{display:grid}
  .hc.all .top{background:linear-gradient(135deg,#2a2e39,#3a4050)}
  @media (max-width:640px){
    .panel{top:auto;bottom:0;right:0;transform:none;width:100%;border-radius:22px 22px 0 0;max-height:86vh;animation:sh .22s ease}
    @keyframes sh{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  }

  /* modal */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .md{background:var(--sur);border:1px solid var(--line);width:min(600px,100%);max-height:92vh;overflow:auto;border-radius:22px}
  .md .img{aspect-ratio:16/10;position:relative}
  .md .img svg{width:100%;height:100%;display:block}
  .md .img .x{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.5);color:#fff}
  .md .pad{padding:16px 18px 18px}
  .md h1{font-size:19px;line-height:1.6}
  .md .when{color:var(--mut);font-size:13.5px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .facts div{background:var(--bg);border-radius:12px;padding:9px;text-align:center;font-size:12.5px;color:var(--mut)}
  .facts b{display:block;color:var(--ink);font-size:15px}
  .price{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mut)}
  .price b{color:var(--yel);font-size:17px}
  .desc{margin-top:12px;font-size:14.5px;color:#cfd3dc}
  .agent{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
  .av{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
  .agent small{display:block;color:var(--mut)}
  .call{display:block;text-align:center;background:var(--yel);color:#111;font-weight:900;border-radius:14px;padding:13px;margin-top:12px;text-decoration:none}
  .note{font-size:12.5px;color:var(--mut);text-align:center;margin-top:8px}
  .f{display:grid;gap:12px}
  .f label{font-size:13.5px;color:var(--mut)}
  .f input,.f select,.f textarea{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-family:inherit;font-size:15px;outline:none}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--yel)}
  .f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .up{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut);font-size:14px}
  .ok{display:none;text-align:center;padding:30px 10px}
  .ok .c{width:66px;height:66px;border-radius:50%;background:rgba(255,193,7,.15);color:var(--yel);display:grid;place-items:center;margin:0 auto 12px;font-size:32px}

  footer{border-top:1px solid var(--line);color:var(--mut);font-size:13px;padding:20px 0}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .fab{display:none}
  @media (max-width:640px){
    .hd{flex-wrap:wrap}
    .logo{flex:1;font-size:20px}
    .locs{order:3;flex-basis:100%}
    .locbtn{flex:1;justify-content:center}
    .post{display:none}
    .th{width:112px}
    .sgo{padding:0 16px}
    .fab{display:block;position:fixed;bottom:18px;left:18px;z-index:30;background:var(--yel);color:#111;border:0;border-radius:999px;padding:12px 20px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  }
</style>
</head>
<body>

<header><div class="wrap hd">
  <div class="logo">زمینم <span>دات</span> کام</div>
  <div class="locs">
    <button class="locbtn" data-open="region"><svg class="i pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>منطقه: <b id="rLbl">همه</b><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="locbtn" data-open="hood"><svg class="i pin" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>محله: <b id="hLbl">همه</b><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <button class="post" onclick="openPost()">+ ثبت آگهی رایگان</button>
</div></header>

<main class="wrap">
  <div class="sbar">
    <label class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="دنبال چه ملکی هستید؟ مثلاً آپارتمان دو خواب"></label>
    <button class="sgo" onclick="render()">جستجو</button>
  </div>
  <div class="cats" id="cats"></div>

  <div class="hb" id="hb"></div>

  <div class="head"><h2 id="ttl">جدیدترین آگهی‌ها</h2><span id="count"></span></div>
  <div class="list" id="list"></div>
</main>

<footer><div class="wrap"><span>© زمینم دات کام</span><span>طراحی: AR Technology</span></div></footer>
<button class="fab" onclick="openPost()">+ ثبت آگهی</button>

<!-- neighborhood picker -->
<div class="pk" id="pk"><div class="dim" onclick="closePk()"></div>
  <div class="panel">
    <div class="ph"><b>انتخاب محله</b><button class="x" onclick="closePk()"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="rtabs" id="rtabs"></div>
    <label class="hsearch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="hq" placeholder="جستجوی نام محله…"></label>
    <div class="hgrid" id="hgrid"></div>
  </div>
</div>

<!-- detail -->
<div class="ov" id="detail"><div class="md" id="dBox"></div></div>

<!-- post -->
<div class="ov" id="postOv"><div class="md"><div class="pad">
  <div class="ph" style="margin-bottom:12px"><b>ثبت آگهی رایگان</b><button class="x" onclick="closeOv('postOv')"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <form class="f" id="pf">
    <div class="up">📷 افزودن عکس‌های ملک<br><small>تا ۱۰ عکس</small></div>
    <label>عنوان آگهی<input required placeholder="مثلاً آپارتمان ۸۵ متری دو خواب"></label>
    <div class="two"><label>نوع آگهی<select id="fType"></select></label><label>محله<select id="fHood"></select></label></div>
    <div class="two"><label>متراژ (متر)<input inputmode="numeric" placeholder="۸۵"></label><label>قیمت (تومان)<input inputmode="numeric" placeholder="۴٬۵۰۰٬۰۰۰٬۰۰۰"></label></div>
    <label>مشاور شما<select id="fAgent"></select></label>
    <label>توضیحات<textarea rows="3" placeholder="طبقه، سال ساخت، امکانات…"></textarea></label>
    <button class="post" style="padding:13px">ارسال آگهی</button>
  </form>
  <div class="ok" id="ok"><div class="c">✓</div><b style="font-size:18px">آگهی شما ثبت شد</b><p style="color:var(--mut);margin-top:4px">پس از تأیید مدیر سایت منتشر می‌شود.</p></div>
</div></div></div>

<script>
const REGIONS={"منطقه ۱":["محله‌ی گلستان","محله‌ی بهار","محله‌ی مرکزی"],"منطقه ۲":["شهرک امید","محله‌ی باغ","محله‌ی نور"]};
/* emoji, short description, tags, gradient */
const HOOD={
 "محله‌ی گلستان":["🌳","آرام و سرسبز، مناسب خانواده",["پارک","آرام"],"#1f7a55,#2fb37a"],
 "محله‌ی بهار":["🌸","نزدیک مدارس و مراکز خرید",["مدرسه","خرید"],"#8a3d6e,#d16aa6"],
 "محله‌ی مرکزی":["🏙","قلب شهر با دسترسی عالی",["مترو","اداری"],"#2b3f86,#4f6fd6"],
 "شهرک امید":["🏡","ویلایی و نوساز",["نوساز","ویلایی"],"#8a5a1f,#d99a3b"],
 "محله‌ی باغ":["🌿","زمین و باغ با قیمت مناسب",["باغ","زمین"],"#4d6b1f,#8fb13b"],
 "محله‌ی نور":["🌊","نزدیک دریا با چشم‌انداز",["ساحل","چشم‌انداز"],"#145f7a,#2fa6cf"]
};
const TYPES=[["all","همه"],["sale","فروش"],["rent","اجاره"],["mortgage","رهن"],["land","زمین"],["villa","ویلا"]];
const AGENTS=["مهندس مرادی","آقای مرادی","آقای کریمی"];
/* title, type, hood, meters, price, time, agent, color, photos, vip */
const ADS=[
 ["آپارتمان ۸۵ متری دو خواب نوساز با پارکینگ","sale","محله‌ی گلستان",85,"۴٫۵ میلیارد تومان","لحظاتی پیش",0,"#5b7bd5",6,0],
 ["ویلا لاکچری استخردار با حیاط ۳۰۰ متری","villa","شهرک امید",300,"۱۲ میلیارد تومان","۱ ساعت پیش",1,"#2f9e74",12,1],
 ["اجاره آپارتمان ۶۰ متری تک‌خواب","rent","محله‌ی بهار",60,"ودیعه ۳۰۰ م · اجاره ۱۲ م","۲ ساعت پیش",2,"#d9843b",4,0],
 ["زمین مسکونی ۲۰۰ متری سند تک‌برگ","land","محله‌ی باغ",200,"۳ میلیارد تومان","۳ ساعت پیش",0,"#8a6d3b",3,0],
 ["رهن کامل واحد ۷۵ متری طبقه دوم","mortgage","محله‌ی مرکزی",75,"رهن ۸۰۰ میلیون","دیروز",1,"#7a5bd5",5,0],
 ["آپارتمان ۱۲۰ متری سه خواب فول امکانات","sale","محله‌ی نور",120,"۶٫۸ میلیارد تومان","دیروز",2,"#3b8fd9",9,1],
 ["ویلا دوبلکس نزدیک دریا","villa","محله‌ی نور",250,"۱۸ میلیارد تومان","۲ روز پیش",0,"#1f8a8a",14,0],
 ["اجاره سوئیت ۴۵ متری مبله","rent","شهرک امید",45,"ودیعه ۱۰۰ م · اجاره ۸ م","۳ روز پیش",1,"#d95b6a",7,0]
];
const st={type:"all",region:"همه",hood:"همه",pkRegion:"همه"};
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString("fa-IR");
const tName=t=>(TYPES.find(x=>x[0]===t)||[])[1];
const regionOf=h=>Object.keys(REGIONS).find(r=>REGIONS[r].includes(h));
const CAM=`<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const X=`<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>`;

function pic(c,k,id){
  const tree=k==="land"||k==="villa",g="g"+id;
  return `<svg class="pic" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="#0d0f14"/></linearGradient></defs>
  <rect width="300" height="300" fill="#1c2029"/><rect width="300" height="300" fill="url(#${g})"/>
  ${k==="land"?`<rect x="40" y="190" width="220" height="44" rx="6" fill="${c}" opacity=".7"/><path d="M40 190h220" stroke="#fff" stroke-width="3" stroke-dasharray="10 8" opacity=".6"/>`:
  k==="villa"?`<path d="M50 140l100-62 100 62z" fill="${c}"/><rect x="65" y="140" width="170" height="88" fill="#eceef3"/><rect x="135" y="180" width="32" height="48" fill="${c}"/><rect x="82" y="158" width="34" height="24" fill="#ffd77a"/><rect x="185" y="158" width="34" height="24" fill="#ffd77a"/><rect x="40" y="238" width="120" height="20" rx="8" fill="#5cc8ff" opacity=".7"/>`:
  `<rect x="90" y="55" width="120" height="175" fill="#eceef3"/><rect x="90" y="55" width="120" height="12" fill="${c}"/>${[0,1,2,3,4].map(r=>[0,1,2].map(q=>`<rect x="${104+q*34}" y="${80+r*28}" width="22" height="16" fill="${(r+q)%3?"#ffd77a":"#9fb0d8"}"/>`).join("")).join("")}<rect x="137" y="200" width="26" height="30" fill="${c}"/>`}
  ${tree?`<circle cx="252" cy="170" r="24" fill="#3aa86b"/><rect x="248" y="188" width="8" height="40" fill="#6b4f33"/>`:""}</svg>`;
}
function hoodsFor(r){return r==="همه"?Object.values(REGIONS).flat():REGIONS[r]}

/* ---------- picker ---------- */
function openPk(focus){
  st.pkRegion=st.region;$("#hq").value="";
  $(".ph b").textContent=focus==="region"?"انتخاب منطقه و محله":"انتخاب محله";
  drawPk();$("#pk").classList.add("on");
  document.querySelectorAll(".locbtn").forEach(b=>b.classList.toggle("open",b.dataset.open===focus));
}
function closePk(){$("#pk").classList.remove("on");document.querySelectorAll(".locbtn").forEach(b=>b.classList.remove("open"))}
function drawPk(){
  $("#rtabs").innerHTML=["همه",...Object.keys(REGIONS)].map(r=>`<button class="${st.pkRegion===r?"on":""}" data-r="${r}">${r==="همه"?"همه‌ی مناطق":r}</button>`).join("");
  $("#rtabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.pkRegion=b.dataset.r;drawPk()});
  const q=$("#hq").value.trim();
  const hs=hoodsFor(st.pkRegion).filter(h=>!q||h.includes(q));
  const all=`<div class="hc all ${st.hood==="همه"&&st.region===st.pkRegion?"on":""}" data-h="همه"><span class="ck">✓</span><div class="top"><span class="e">🗺</span></div><div class="bd"><b>همه‌ی محله‌ها</b><small>${st.pkRegion==="همه"?"کل شهر":st.pkRegion}</small><span class="n">${fa(ADS.filter(a=>hoodsFor(st.pkRegion).includes(a[2])).length)} آگهی</span></div></div>`;
  $("#hgrid").innerHTML=(q?"":all)+hs.map(h=>{
    const [e,d,,g]=HOOD[h],ads=ADS.filter(a=>a[2]===h);
    const by=[...new Set(ads.map(a=>a[1]))].map(tName).join(" · ")||"—";
    return `<div class="hc ${st.hood===h?"on":""}" data-h="${h}"><span class="ck">✓</span>
      <div class="top" style="background:linear-gradient(135deg,${g})"><span class="e">${e}</span><span class="rg">${regionOf(h)}</span></div>
      <div class="bd"><b>${h.replace("محله‌ی ","")}</b><small>${d}</small><span class="n">${fa(ads.length)} آگهی · ${by}</span></div></div>`;
  }).join("")||`<div style="grid-column:1/-1;text-align:center;color:var(--mut);padding:20px">محله‌ای پیدا نشد</div>`;
  $("#hgrid").querySelectorAll(".hc").forEach(c=>c.onclick=()=>{
    const h=c.dataset.h;
    if(h==="همه"){st.region=st.pkRegion;st.hood="همه"}else{st.hood=h;st.region=st.pkRegion==="همه"?"همه":st.pkRegion}
    closePk();render();window.scrollTo({top:0,behavior:"smooth"});
  });
}
$("#hq").addEventListener("input",drawPk);
document.querySelectorAll(".locbtn").forEach(b=>b.onclick=()=>openPk(b.dataset.open));

/* ---------- list ---------- */
function render(){
  $("#rLbl").textContent=st.region;
  $("#hLbl").textContent=st.hood==="همه"?"همه":st.hood.replace("محله‌ی ","");
  $("#cats").innerHTML=TYPES.map(t=>`<button class="cat ${st.type===t[0]?"on":""}" data-k="${t[0]}">${t[1]}</button>`).join("");
  $("#cats").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{st.type=b.dataset.k;render()});
  /* banner */
  const hb=$("#hb");
  if(st.hood!=="همه"){
    const [e,d,tags,g]=HOOD[st.hood],n=ADS.filter(a=>a[2]===st.hood).length;
    hb.style.background=`linear-gradient(135deg,${g})`;
    hb.innerHTML=`<div class="em">${e}</div><div><h2>${st.hood}</h2><p>${d} · ${regionOf(st.hood)}</p><div class="tags">${tags.map(t=>`<span>${t}</span>`).join("")}<span>${fa(n)} آگهی فعال</span></div></div><button class="clr" id="clr">× حذف فیلتر</button>`;
    hb.classList.add("on");$("#clr").onclick=()=>{st.hood="همه";render()};
  }else hb.classList.remove("on");
  const q=$("#q").value.trim(),hs=hoodsFor(st.region);
  const L=ADS.map((a,i)=>[a,i]).filter(([a])=>(st.type==="all"||a[1]===st.type)&&hs.includes(a[2])&&(st.hood==="همه"||a[2]===st.hood)&&(!q||a[0].includes(q)));
  $("#ttl").textContent=st.hood==="همه"?"جدیدترین آگهی‌ها":"آگهی‌های این محله";
  $("#count").textContent=fa(L.length)+" آگهی";
  $("#list").innerHTML=L.length?L.map(([a,i])=>`
   <article class="ad" data-i="${i}">
     <div class="th">${pic(a[7],a[1],i)}${a[9]?'<span class="vip">ویژه</span>':""}<span class="cnt">${CAM}${fa(a[8])}</span></div>
     <div class="txt">
       <span class="ty">${tName(a[1])}</span>
       <h3>${a[0]}</h3>
       <div class="m">📍 ${a[2]} · ${fa(a[3])} متر</div>
       <div class="m">${a[5]}</div>
       <div class="pr">${a[4]}</div>
     </div>
   </article>`).join(""):`<div class="empty">آگهی‌ای با این فیلتر پیدا نشد</div>`;
  $("#list").querySelectorAll(".ad").forEach(d=>d.onclick=()=>openAd(+d.dataset.i));
}

function openAd(i){
  const a=ADS[i],ag=AGENTS[a[6]];
  $("#dBox").innerHTML=`<div class="img">${pic(a[7],a[1],"d"+i)}<button class="x" onclick="closeOv('detail')">${X}</button></div>
  <div class="pad">
    <h1>${a[0]}</h1><div class="when">${a[5]} · ${a[2]}</div>
    <div class="facts"><div><b>${fa(a[3])}</b>متر</div><div><b>${tName(a[1])}</b>نوع آگهی</div><div><b>${a[2].replace("محله‌ی ","")}</b>محله</div></div>
    <div class="price"><span>قیمت</span><b>${a[4]}</b></div>
    <div class="desc">نورگیر عالی، دسترسی آسان به مدرسه و مراکز خرید، سند تک‌برگ. برای بازدید با مشاور هماهنگ کنید.</div>
    <div class="agent"><div class="av">${ag[0]}</div><div><b>${ag}</b><small>مشاور این آگهی · زمینم دات کام</small></div></div>
    <a class="call" href="tel:0">📞 تماس با مشاور</a>
    <div class="note">🔒 برای حفظ حریم خصوصی، شماره‌ی مالک نمایش داده نمی‌شود.</div>
  </div>`;
  $("#detail").classList.add("on");
}
function openPost(){$("#pf").style.display="";$("#ok").style.display="none";$("#postOv").classList.add("on")}
function closeOv(id){$("#"+id).classList.remove("on")}
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("on")}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePk();closeOv("detail");closeOv("postOv")}});
$("#fType").innerHTML=TYPES.slice(1).map(t=>`<option>${t[1]}</option>`).join("");
$("#fHood").innerHTML=Object.values(REGIONS).flat().map(h=>`<option>${h}</option>`).join("");
$("#fAgent").innerHTML=AGENTS.map(a=>`<option>${a}</option>`).join("");
$("#pf").onsubmit=e=>{e.preventDefault();$("#pf").style.display="none";$("#ok").style.display="block"};
$("#q").addEventListener("input",render);
render();
</script>
</body>
</html>
